version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: polls-postgres
    environment:
      POSTGRES_DB: pollsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: denis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    networks:
      - polls-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polls-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pollsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: denis
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polls-network
    restart: unless-stopped

  # Frontend (React/Vite) - pentru viitor
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polls-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - polls-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  polls-network:
    driver: bridge
