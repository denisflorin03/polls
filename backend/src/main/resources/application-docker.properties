# Docker profile for Spring Boot application
spring.application.name=polls-backend
server.port=8081

# Database configuration for Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/pollsdb
spring.datasource.username=postgres
spring.datasource.password=denis

# JPA configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.com.polls.backend=DEBUG
logging.level.org.springframework.web=DEBUG
